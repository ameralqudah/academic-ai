<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12417a"/>
      <stop offset="100%" stop-color="#0d3161"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fc0cb"/>
      <stop offset="100%" stop-color="#0e8c97"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <g transform="translate(256 256) scale(0.74) translate(-256 -256)">
    <!-- open book: two leaves meeting at a spine -->
    <path d="M256 168 C 214 140, 160 134, 116 140 L 116 356 C 160 350, 214 356, 256 384 Z"
          fill="#ffffff" opacity="0.96"/>
    <path d="M256 168 C 298 140, 352 134, 396 140 L 396 356 C 352 350, 298 356, 256 384 Z"
          fill="#ffffff" opacity="0.78"/>
    <path d="M256 168 L 256 384" stroke="#0d3161" stroke-width="10"
          stroke-linecap="round" opacity="0.35"/>
    <!-- lines of text on the left leaf -->
    <g stroke="#12417a" stroke-width="12" stroke-linecap="round" opacity="0.30">
      <path d="M150 196 L 222 204"/>
      <path d="M150 236 L 222 244"/>
      <path d="M150 276 L 200 282"/>
    </g>
    <!-- the spark: the "AI" half of the name, kept abstract -->
    <path d="M256 40 L 274 96 L 330 114 L 274 132 L 256 188 L 238 132 L 182 114 L 238 96 Z"
          fill="url(#spark)"/>
  </g>
</svg>