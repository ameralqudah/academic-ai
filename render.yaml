# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Creates the web service with the correct build and start commands. The database
# lives on Neon (set DATABASE_URL below), so no Postgres is declared here.
#
# The build runs migrations and seeds the subscription plans before compiling, so
# a fresh deploy comes up with a working schema and a default plan.
services:
  - type: web
    name: academic-ai
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run db:migrate && npm run db:seed && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # --- set these in the Render dashboard (marked sync:false = not in git) ---
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AUTH_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # --- safe defaults ---
      - key: AI_PROVIDER
        value: anthropic
      - key: EMAIL_PROVIDER
        value: resend
      - key: BILLING_PROVIDER
        value: manual
      - key: MANUAL_BILLING_ALLOW_PAID
        value: "false"
      - key: RATE_LIMIT_STORE
        value: memory
      - key: AUTH_RATE_LIMIT_MAX
        value: "5"
      - key: LOG_LEVEL
        value: info
      # --- background jobs (P0.10) ---
      # inline: the web process queues AND runs agent tasks, deep research and
      # PLS bootstraps from a durable PostgreSQL queue (pg-boss). No extra
      # service needed. Switch to "worker" when you add the worker below.
      - key: JOB_RUNNER
        value: inline

  # --- optional: a dedicated background worker --------------------------------
  # Uncomment to run background jobs outside the web process (set JOB_RUNNER to
  # "worker" on BOTH services). Creating it adds a billed Render service.
  #
  # - type: worker
  #   name: academic-ai-worker
  #   runtime: node
  #   plan: starter
  #   region: frankfurt
  #   branch: main
  #   buildCommand: npm ci
  #   startCommand: npm run worker
  #   envVars:
  #     - key: NODE_VERSION
  #       value: "22"
  #     - key: JOB_RUNNER
  #       value: worker
  #     - key: DATABASE_URL
  #       sync: false
  #     - key: AUTH_SECRET
  #       sync: false
  #     - key: ANTHROPIC_API_KEY
  #       sync: false
